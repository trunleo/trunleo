<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#f5b759" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#f5b759" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="2" y="2" width="996" height="276" rx="14"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="996" height="276" rx="14" fill="#0b0e14"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#grid)"/>
    <rect width="1000" height="280" fill="url(#glow)"/>
  </g>
  <rect x="2" y="2" width="996" height="276" rx="14" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.5"/>

  <!-- Terminal prompt -->
  <text x="70" y="78" font-size="17" fill="#f5b759">~$ whoami</text>
  <rect x="172" y="64" width="10" height="17" fill="#f5b759">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Name -->
  <text x="68" y="138" font-size="46" font-weight="bold" fill="#e6eaf2" letter-spacing="1">TRUNG TRAN <tspan fill="#f5b759">(LEO)</tspan></text>

  <!-- Role -->
  <text x="70" y="176" font-size="17" fill="#8b94a7">Senior Data Engineer @ OPSWAT &#183; Ho Chi Minh City, Vietnam</text>

  <!-- Pipeline -->
  <g>
    <line x1="70" y1="228" x2="930" y2="228" stroke="rgba(148,163,184,0.25)" stroke-width="1.5"/>
    <line x1="70" y1="228" x2="930" y2="228" stroke="#f5b759" stroke-width="1.5" stroke-dasharray="7 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-210" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Node: extract -->
    <circle cx="70" cy="228" r="6" fill="#0b0e14" stroke="#f5b759" stroke-width="2">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="256" font-size="12" fill="#8b94a7" text-anchor="middle">extract</text>

    <!-- Node: transform -->
    <circle cx="356" cy="228" r="6" fill="#0b0e14" stroke="#f5b759" stroke-width="2">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <text x="356" y="256" font-size="12" fill="#8b94a7" text-anchor="middle">transform</text>

    <!-- Node: validate -->
    <circle cx="644" cy="228" r="6" fill="#0b0e14" stroke="#f5b759" stroke-width="2">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="644" y="256" font-size="12" fill="#8b94a7" text-anchor="middle">validate</text>

    <!-- Node: load -->
    <circle cx="930" cy="228" r="6" fill="#f5b759" stroke="#f5b759" stroke-width="2">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </circle>
    <text x="930" y="256" font-size="12" fill="#f5b759" text-anchor="middle">load &#10003;</text>
  </g>
</svg>
